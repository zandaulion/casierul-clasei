  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-select {

  }

    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {

    height: 44px;
  }

    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {

    max-width: 100%;

  }

  .form-check {

    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {

    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;

        { id: &#x27;serban&#x27;, surname: &#x27;Șerban&#x27;, first: &#x27;Maria&#x27;, expenses: [{ id: &#x27;books&#x27;, name: &#x27;Culegeri&#x27;, due: 6800 }, { id: &#x27;trip&#x27;, name: &#x27;Excursie&#x27;, due: 5000 }, { id: &#x27;materials&#x27;, name: &#x27;Materiale&#x27;, due: 2500 }] },
        { id: &#x27;exemplu&#x27;, surname: &#x27;Exemplu&#x27;, first: &#x27;Ioana&#x27;, expenses: [{ id: &#x27;trip&#x27;, name: &#x27;Excursie&#x27;, due: 5000 }] },

        { id: &#x27;balan&#x27;, surname: &#x27;Bălan&#x27;, first: &#x27;David&#x27;, expenses: [{ id: &#x27;books&#x27;, name: &#x27;Culegeri&#x27;, due: 7550 }, { id: &#x27;trip&#x27;, name: &#x27;Excursie&#x27;, due: 5000 }] }

      };

      const fullName = child =&gt; child.surname + &#x27; &#x27; + child.first;
      const selected = () =&gt; children.find(child =&gt; child.id === state.childId);
      const state = { childId: null, target: &#x27;all&#x27;, amount: &#x27;&#x27;, round: null, excess: &#x27;change&#x27;, manual: false, allocations: {} };

        root.querySelectorAll(&#x27;[data-target]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(!state.manual &amp;&amp; button.dataset.target === state.target)));
        root.querySelectorAll(&#x27;[data-round]&#x27;).forEach(button =&gt; {
          const unit = Number(button.dataset.round);
          button.querySelector(&#x27;.cc-round-value&#x27;).textContent = money(Math.ceil(baseAmount(child) / (unit * 100)) * unit * 100);

        });
        find(&#x27;cc-rounds&#x27;).hidden = state.manual; find(&#x27;cc-round-label&#x27;).hidden = state.manual;
        find(&#x27;cc-round-label&#x27;).textContent = state.target === &#x27;all&#x27; ? &#x27;Rotunjește totalul în sus&#x27; : &#x27;Rotunjește cheltuiala în sus&#x27;;
        root.querySelectorAll(&#x27;[data-excess]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.excess === state.excess)));
        find(&#x27;cc-manual&#x27;).checked = state.manual;
        const result = calculate(child);

        find(&#x27;cc-summary&#x27;).hidden = !!result.error; find(&#x27;cc-preview&#x27;).disabled = !!result.error;

        if (!result.error) {

          find(&#x27;cc-change-row&#x27;).hidden = !result.change; find(&#x27;cc-credit-row&#x27;).hidden = !result.credit;

          find(&#x27;cc-confirmation&#x27;).textContent = fullName(child) + &#x27;: &#x27; + money(result.amount) + &#x27; primiți; &#x27; + money(result.covered) + &#x27; pentru &#x27; + target + &#x27;; &#x27; + money(result.change) + &#x27; rest; &#x27; + money(result.credit) + &#x27; avans. Nicio operațiune nu a fost salvată.&#x27;;
