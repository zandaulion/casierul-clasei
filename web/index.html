<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23634d">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Contribuțiile copiilor și registrul fondului clasei.">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <title>Casierul clasei</title>
</head>
<body>
  <a class="skip" href="#main">Mergi la conținut</a>
  <div class="app">
    <header class="top">
      <div class="top-main">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 3v18M3 7h4M3 12h4M3 17h4M12 8h5M12 12h4"/></svg>
        </span>
        <div id="header-logos" class="header-logos" hidden>
          <img id="header-school-logo" alt="Sigla școlii" hidden>
          <img id="header-class-logo" alt="Sigla clasei" hidden>
        </div>
        <div class="top-copy">
          <div class="brand">Casierul clasei</div>
          <div id="class-label" class="caption">Fondul clasei, la îndemână</div>
          <select id="classroom-selector" aria-label="Clasa activă" hidden></select>
        </div>
      </div>
      <button id="settings-button" class="icon-button" data-action="settings" hidden aria-label="Setări">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.7 2.2-2 .9-2.1-.5-2.5 4.3 1.5 1.7v2.3L2.2 15.5l2.5 4.3 2.1-.5 2 .9.7 2.2h5l.7-2.2 2-.9 2.1.5 2.5-4.3-1.5-1.6v-2.3l1.5-1.7-2.5-4.3-2.1.5-2-.9L14.5 3z" transform="translate(0 -.7) scale(1 .98)"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>
    <div id="connection" class="notice" role="status" hidden></div>
    <div id="pending-notice" class="notice warning" role="alert" hidden></div>
    <main id="main" tabindex="-1">
      <div class="empty"><h1>Se încarcă…</h1><p>Conectăm registrul clasei.</p></div>
    </main>
    <nav id="tabs" class="tabs" aria-label="Ecrane principale" hidden>
      <button data-tab="children" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-3-5.2"/></svg>
        <span>Copii</span>
      </button>
      <button data-tab="expenses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 5 8H7z"/><rect x="3" y="15" width="7" height="7" rx="1"/><circle cx="18" cy="18.5" r="3.5"/></svg>
        <span>Cheltuieli</span>
      </button>
      <button data-tab="ledger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8V6a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v11H5a3 3 0 0 1-3-3V7"/><path d="M20 13h-5v5h5M16.5 15.5h.01"/></svg>
        <span>Registru</span>
      </button>
      <button data-tab="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h7l4 4v12H9zM16 3v5h4M5 7H3v14h12M12 12h5M12 15h4"/></svg>
        <span>Rapoarte</span>
      </button>
    </nav>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="modal-form">
      <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button type="button" class="icon-button" data-action="close-modal" aria-label="Închide">×</button>
      </div>
      <div id="modal-content"></div>
      <p id="modal-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" data-action="close-modal">Renunță</button>
        <button type="submit" class="primary" id="modal-submit">Salvează</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <noscript><p class="notice">Activează JavaScript pentru a folosi registrul clasei.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
