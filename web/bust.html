<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se actualizează…</title>
<!--
  The escape hatch, served at /bust with Cache-Control: no-store and
  Clear-Site-Data: "cache". Nothing else on the origin should be able to
  intercept it -- sw.js deliberately refuses to handle this path, or the way
  out would sit behind the thing it exists to get out of.

  Send someone here when their app is wedged on an old version and nothing
  else has worked.
-->
<style>
  body { display: grid; place-items: center; min-height: 100vh; margin: 0;
         font-family: system-ui, sans-serif; background: #12140F; color: #EFF0E6;
         text-align: center; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 16px;
             border: 3px solid rgba(255,255,255,.2); border-top-color: #7CC79E;
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s } }
</style>
<div>
  <div class="spinner"></div>
  <h2>Se actualizează…</h2>
  <p>Se golește memoria cache și se încarcă versiunea curentă.</p>
</div>
<script src="/bust.js"></script>
